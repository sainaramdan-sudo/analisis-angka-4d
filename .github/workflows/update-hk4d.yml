name: Update HK SGP SDY history
on:
  schedule:
    - cron: '20 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-hk4d
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate primary archive with fallback source
        run: python scripts/update_hk4d.py
      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hk4d.json
          if ! git diff --cached --quiet; then
            git commit -m "Update HK SGP SDY daily results"
            git push
          fi
